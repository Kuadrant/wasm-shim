[package]
name = "wasm-shim"
version = "0.13.0-dev"
edition = "2021"
authors = ["Alex Snaps <asnaps@redhat.com>", "Eguzki Astiz Lezaun <eguzki@redhat.com>", "Didier Di Cesare <dcesare@redhat.com>", "Adam Cattermole <acatterm@redhat.com>", "Rahul Anand <rahulanand16nov@gmail.com>"]
description = "Wasm module connecting envoy and authorino/limitador"
license = "Apache-2.0"
keywords = ["rate-limiting", "rate", "limiter", "envoy", "rls"]
categories = ["web-programming"]
homepage = "https://kuadrant.io"
repository = "https://github.com/Kuadrant/wasm-shim"
documentation = "https://kuadrant.io"
readme = "README.md"

[lib]
crate-type = ["cdylib"]

[features]
default = []
debug-host-behaviour = ["kuadrant-filter/debug-host-behaviour"]

[dependencies]
kuadrant-filter = { path = "../kuadrant-filter" }
proxy-wasm = { git = "https://github.com/Kuadrant/proxy-wasm-rust-sdk.git", rev = "6ceedbb" }
const_format = "0.2.31"
log = "0.4"
tracing = "0.1.41"
serde_json = "1.0"
opentelemetry = "0.31"
opentelemetry_sdk = "0.31"

[dev-dependencies]
proxy-wasm-test-framework = { git = "https://github.com/Kuadrant/wasm-test-framework.git", rev = "33b318b" }
serial_test = "2.0.0"
prost-reflect = { version = "0.16", features = ["serde"] }
prost-types = "0.14"

[lints.clippy]
panic = "deny"
unwrap_used = "deny"
expect_used = "deny"
